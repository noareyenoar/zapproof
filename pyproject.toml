[project]
name = "zapproof-mcp"
version = "0.1.2"
description = "Check an EVM address's settled-payment record before you pay it"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
    "mcp",
    "mcp-server",
    "x402",
    "agent-reputation",
    "ai-agents",
    "base",
    "usdc",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # EIP-55 checksum validation needs keccak-256, which hashlib does not provide
    # (sha3_256 uses different padding). eth-utils is the smallest dependency that
    # provides it.
    "eth-utils>=4.0",
    # eth-utils needs an explicit keccak backend. Without it, is_checksum_address
    # raises ImportError at call time and every mixed-case address would be rejected.
    "eth-hash[pycryptodome]>=0.7",
    "mcp>=2.3.0,<3",
    "coincurve>=21.0.0",
    "eth-account>=0.14.0",
]

[project.urls]
Repository = "https://github.com/noareyenoar/zapproof"
Issues = "https://github.com/noareyenoar/zapproof/issues"

[project.scripts]
zapproof-mcp = "repindex.mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repindex"]
# The snapshot is gitignored (it is a database) but must ship in the wheel: without it
# an installed package has nothing to read. Build it with scripts/build_snapshot.py.
artifacts = [
    "src/repindex/data/snapshot.db",
    "src/repindex/data/snapshot.json",
]

[tool.hatch.build.targets.sdist]
artifacts = [
    "src/repindex/data/snapshot.db",
    "src/repindex/data/snapshot.json",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "gates", "scripts"]
# Scratch probes and lab scripts live in tmp/ and are never committed. They are not
# source, and linting them made GA.1 fail on 2026-11-16 with errors in tmp/probe_*.py.
extend-exclude = ["tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/repindex"]
# Note (prompt Section 4): mypy is enforced on core modules. Modules that talk to
# untyped third-party surfaces may relax individual rules with a documented reason.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
