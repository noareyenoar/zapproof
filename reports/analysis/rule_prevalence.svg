<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="t">Share of sellers where each classifier rule fired</title>
<desc>Horizontal bars over 19,397 classified sellers. Values are percentages and are printed beside each bar.</desc>

<style>
.surface{fill:#fcfcfb}
.ink{fill:#0b0b0b}
.secondary{fill:#52514e}
.muted{fill:#898781}
.grid{stroke:#e1e0d9;stroke-width:1}
.axis{stroke:#c3c2b7;stroke-width:1}
.series{fill:#2a78d6;stroke:#2a78d6}
.series-fill{fill:#2a78d6;fill-opacity:.10;stroke:none}
.line{fill:none;stroke:#2a78d6;stroke-width:2}
.ring{stroke:#fcfcfb;stroke-width:2}
@media (prefers-color-scheme: dark){
.surface{fill:#1a1a19}
.ink{fill:#f0efec}
.secondary{fill:#c3c2b7}
.muted{fill:#898781}
.grid{stroke:#2c2c2a}
.axis{stroke:#383835}
.series{fill:#3987e5;stroke:#3987e5}
.series-fill{fill:#3987e5}
.line{stroke:#3987e5}
.ring{stroke:#1a1a19}
}
</style>

