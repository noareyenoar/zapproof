# Build and push the hosted image. Invoked by deploy.sh:
#   gcloud builds submit --config deploy/cloudrun/cloudbuild.yaml \
#     --substitutions=_REGION=us-central1,_REPO=zapproof,_IMAGE=zapproof,_TAG=<sha> .
substitutions:
  _REGION: us-central1
  _REPO: zapproof
  _IMAGE: zapproof
  _TAG: latest

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - deploy/cloudrun/Dockerfile
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:${_TAG}
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:${_TAG}

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100

timeout: 1800s
